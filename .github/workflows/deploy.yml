name: Deploy HyperRogue Interactive WebApp to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone ../hyperrogue if Not Present
        run: |
          if [ ! -d ../hyperrogue ]; then
            git clone --depth 1 https://github.com/zenorogue/hyperrogue/ ../hyperrogue
          fi

      - name: Install Native Dependencies for Original HyperRogue FFI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev libgl1-mesa-dev zlib1g-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Original HyperRogue C++ FFI Object
        uses: actions/cache@v4
        with:
          path: target/orig_cache
          key: hyper-orig-cache-${{ runner.os }}-${{ hashFiles('build.rs', 'cpp_bridge/bridge.cpp') }}

      - name: Cache Cargo Build Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Automated Unit & C++ FFI Cross-Validation Tests
        run: cargo test --release

      - name: Build Interactive 60 FPS Web Bundle
        run: |
          mkdir -p dist
          cargo run --release -- --html dist/index.html
          cargo run --release -- --nil-penrose dist/nil_penrose.svg
          cargo run --release -- --nil-staircase dist/nil_staircase.svg
          cargo run --release -- --no-ascii --steps 8 --svg dist/hyperbolic_poincare.svg
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/nil_penrose.svg
          test -s dist/nil_staircase.svg
          test -s dist/hyperbolic_poincare.svg

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
